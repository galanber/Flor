<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tu flor amarilla 🌻</title>

    <link rel="stylesheet" href="styles.css">
</head>


<body>

    <header>
        <h1>Una flor amarilla</h1>
        <p>Una pequeña flor para tu día Mishoo</p>
    </header>


    <main>

        <section class="scene">

            <div class="flower-container">

                <img 
                    class="sunflower"
                    src="assets/sunflower.svg"
                    alt="Girasol amarillo"
                >

                <img
                    class="bee"
                    src="assets/bee.svg"
                    alt="Abeja"
                >

            </div>

        </section>


    </main>


    <footer>
        <p>🌻</p>
    </footer>


<script src="script.js"></script>

</body>

</html>
